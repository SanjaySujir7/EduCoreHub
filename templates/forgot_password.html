<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forgot Password | EduCoreHub</title>
    <meta name="description" content="Reset your EduCoreHub password via email OTP verification." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@400;600;700;800&display=swap"
        rel="stylesheet" />
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --primary: #6c63ff;
            --primary-dark: #4e48c4;
            --primary-light: #9d97ff;
            --accent: #43e97b;
            --accent2: #38f9d7;
            --bg: #0d0f18;
            --surface: #13172a;
            --surface2: #1c2140;
            --border: rgba(108, 99, 255, 0.25);
            --text: #e8eaf6;
            --text-muted: #8b90b5;
            --error: #ff4d6d;
            --success: #43e97b;
            --input-radius: 12px;
            --card-radius: 20px;
            --transition: 0.3s ease;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: -200px;
            left: -200px;
            width: 700px;
            height: 700px;
            background: radial-gradient(circle, rgba(108, 99, 255, 0.18) 0%, transparent 70%);
            border-radius: 50%;
            animation: floatBlob1 12s ease-in-out infinite;
            pointer-events: none;
            z-index: 0;
        }

        body::after {
            content: '';
            position: fixed;
            bottom: -200px;
            right: -200px;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(67, 233, 123, 0.13) 0%, transparent 70%);
            border-radius: 50%;
            animation: floatBlob2 15s ease-in-out infinite;
            pointer-events: none;
            z-index: 0;
        }

        @keyframes floatBlob1 {

            0%,
            100% {
                transform: translate(0, 0) scale(1)
            }

            50% {
                transform: translate(60px, 80px) scale(1.1)
            }
        }

        @keyframes floatBlob2 {

            0%,
            100% {
                transform: translate(0, 0) scale(1)
            }

            50% {
                transform: translate(-40px, -60px) scale(1.08)
            }
        }

        .card {
            max-width: 460px;
            width: 100%;
            background: var(--surface);
            border-radius: var(--card-radius);
            border: 1px solid var(--border);
            box-shadow: 0 30px 80px rgba(0, 0, 0, .5), 0 0 0 1px rgba(108, 99, 255, .08);
            padding: 48px 44px;
            position: relative;
            z-index: 1;
            animation: cardIn 0.7s cubic-bezier(.22, 1, .36, 1) both;
        }

        @keyframes cardIn {
            from {
                opacity: 0;
                transform: translateY(40px)
            }

            to {
                opacity: 1;
                transform: translateY(0)
            }
        }

        .brand-logo {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 32px;
        }

        .brand-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, var(--primary), var(--accent2));
            border-radius: 11px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            box-shadow: 0 8px 24px rgba(108, 99, 255, .45);
        }

        .brand-name {
            font-family: 'Outfit', sans-serif;
            font-size: 20px;
            font-weight: 800;
            background: linear-gradient(135deg, #fff 40%, var(--primary-light));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        h2 {
            font-family: 'Outfit', sans-serif;
            font-size: 26px;
            font-weight: 800;
            margin-bottom: 6px;
        }

        .subtitle {
            font-size: 13.5px;
            color: var(--text-muted);
            margin-bottom: 28px;
        }

        .field-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 16px;
        }

        label {
            font-size: 12.5px;
            font-weight: 600;
            color: var(--text-muted);
            letter-spacing: .04em;
            text-transform: uppercase;
        }

        .input-wrap {
            position: relative;
        }

        .input-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 16px;
            pointer-events: none;
            transition: color var(--transition);
        }

        input {
            width: 100%;
            padding: 13px 14px 13px 42px;
            background: var(--surface2);
            border: 1.5px solid rgba(255, 255, 255, .07);
            border-radius: var(--input-radius);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            outline: none;
            transition: all var(--transition);
        }

        input:focus {
            border-color: var(--primary);
            background: rgba(108, 99, 255, .07);
            box-shadow: 0 0 0 3px rgba(108, 99, 255, .15);
        }

        .input-wrap:focus-within .input-icon {
            color: var(--primary-light);
        }

        input.error {
            border-color: var(--error);
            box-shadow: 0 0 0 3px rgba(255, 77, 109, .15);
        }

        .toggle-pw {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 16px;
            padding: 0;
            transition: color var(--transition);
        }

        .toggle-pw:hover {
            color: var(--primary-light);
        }

        input.has-toggle {
            padding-right: 44px;
        }

        .submit-btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: var(--input-radius);
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: #fff;
            font-family: 'Outfit', sans-serif;
            font-size: 15px;
            font-weight: 700;
            letter-spacing: .02em;
            cursor: pointer;
            transition: all var(--transition);
            position: relative;
            overflow: hidden;
            box-shadow: 0 6px 24px rgba(108, 99, 255, .4);
            margin-top: 8px;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 32px rgba(108, 99, 255, .55);
        }

        .submit-btn:active {
            transform: translateY(0);
        }

        .submit-btn:disabled {
            opacity: .6;
            cursor: not-allowed;
            transform: none !important;
        }

        .alert-banner {
            border-radius: var(--input-radius);
            padding: 14px 16px;
            font-size: 13.5px;
            align-items: center;
            gap: 10px;
            animation: fadeIn .4s ease;
            display: none;
            margin-bottom: 18px;
        }

        .alert-banner.visible {
            display: flex;
        }

        .alert-success {
            background: rgba(67, 233, 123, .1);
            border: 1px solid rgba(67, 233, 123, .3);
            color: var(--success);
        }

        .alert-error {
            background: rgba(255, 77, 109, .1);
            border: 1px solid rgba(255, 77, 109, .3);
            color: var(--error);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-8px)
            }

            to {
                opacity: 1;
                transform: translateY(0)
            }
        }

        .footer-links {
            text-align: center;
            margin-top: 22px;
            font-size: 13px;
            color: var(--text-muted);
        }

        .footer-links a {
            color: var(--primary-light);
            font-weight: 600;
            text-decoration: none;
            transition: color var(--transition);
        }

        .footer-links a:hover {
            color: #fff;
        }

        /* OTP input group */
        .otp-group {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 20px;
        }

        .otp-input {
            width: 50px;
            height: 56px;
            text-align: center;
            padding: 0;
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 0;
            border-radius: var(--input-radius);
            background: var(--surface2);
            border: 1.5px solid rgba(255, 255, 255, .07);
            color: var(--text);
            font-family: 'Outfit', sans-serif;
            outline: none;
            transition: all var(--transition);
        }

        .otp-input:focus {
            border-color: var(--primary);
            background: rgba(108, 99, 255, .07);
            box-shadow: 0 0 0 3px rgba(108, 99, 255, .15);
        }

        .step {
            display: none;
        }

        .step.active {
            display: block;
        }

        .timer-text {
            font-size: 12px;
            color: var(--text-muted);
            text-align: center;
            margin-bottom: 16px;
        }

        .timer-text span {
            color: var(--primary-light);
            font-weight: 600;
        }

        .resend-btn {
            background: none;
            border: none;
            color: var(--primary-light);
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            text-decoration: underline;
            font-family: 'Inter', sans-serif;
        }

        .resend-btn:disabled {
            color: var(--text-muted);
            cursor: not-allowed;
            text-decoration: none;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            color: var(--text-muted);
            text-decoration: none;
            margin-bottom: 24px;
            transition: color var(--transition);
        }

        .back-link:hover {
            color: var(--primary-light);
        }

        @media(max-width:520px) {
            .card {
                padding: 36px 24px;
            }

            .otp-input {
                width: 44px;
                height: 50px;
                font-size: 20px;
            }
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>
    <div class="card">
        <div class="brand-logo">
            <div class="brand-icon">🎓</div>
            <span class="brand-name">EduCoreHub</span>
        </div>

        <a href="/login" class="back-link">← Back to Login</a>

        <div class="alert-banner alert-success" id="successBanner" role="alert"><span id="successMsg"></span></div>
        <div class="alert-banner alert-error" id="errorBanner" role="alert"><span id="errorMsg"></span></div>

        <!-- ══ STEP 1: Enter Email ══ -->
        <div class="step active" id="step1">
            <h2>Forgot Password?</h2>
            <p class="subtitle">Enter your registered email and we'll send you a 6-digit OTP to reset your password.</p>

            <form id="emailForm" novalidate>
                <div class="field-group">
                    <label for="email">Email Address</label>
                    <div class="input-wrap">
                        <span class="input-icon">✉️</span>
                        <input type="email" id="email" name="email" placeholder="you@college.edu" autocomplete="email"
                            required />
                    </div>
                </div>
                <button type="submit" class="submit-btn" id="sendOtpBtn">
                    Send OTP →
                </button>
            </form>

            <div class="footer-links">
                Remember your password? <a href="/login">Sign In</a>
            </div>
        </div>

        <!-- ══ STEP 2: Enter OTP + New Password ══ -->
        <div class="step" id="step2">
            <h2>Verify & Reset</h2>
            <p class="subtitle">Enter the 6-digit OTP sent to <strong id="maskedEmail"></strong></p>

            <form id="resetForm" novalidate>
                <div class="otp-group">
                    <input class="otp-input" type="text" maxlength="1" data-idx="0" inputmode="numeric"
                        autocomplete="one-time-code" />
                    <input class="otp-input" type="text" maxlength="1" data-idx="1" inputmode="numeric" />
                    <input class="otp-input" type="text" maxlength="1" data-idx="2" inputmode="numeric" />
                    <input class="otp-input" type="text" maxlength="1" data-idx="3" inputmode="numeric" />
                    <input class="otp-input" type="text" maxlength="1" data-idx="4" inputmode="numeric" />
                    <input class="otp-input" type="text" maxlength="1" data-idx="5" inputmode="numeric" />
                </div>

                <div class="timer-text" id="timerText">
                    OTP expires in <span id="countdown">10:00</span>
                    &nbsp;·&nbsp;
                    <button type="button" class="resend-btn" id="resendBtn" disabled>Resend OTP</button>
                </div>

                <div class="field-group">
                    <label for="newPassword">New Password</label>
                    <div class="input-wrap">
                        <span class="input-icon">🔒</span>
                        <input type="password" id="newPassword" placeholder="Min. 8 characters" class="has-toggle"
                            required />
                        <button type="button" class="toggle-pw" onclick="togglePw('newPassword', this)">👁️</button>
                    </div>
                </div>

                <div class="field-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <div class="input-wrap">
                        <span class="input-icon">🔒</span>
                        <input type="password" id="confirmPassword" placeholder="Repeat password" class="has-toggle"
                            required />
                        <button type="button" class="toggle-pw" onclick="togglePw('confirmPassword', this)">👁️</button>
                    </div>
                </div>

                <button type="submit" class="submit-btn" id="resetBtn">
                    Reset Password →
                </button>
            </form>
        </div>
    </div>

    <script>
        let userEmail = '';
        let countdownTimer = null;

        // ── Helpers ──
        function togglePw(id, btn) {
            const inp = document.getElementById(id);
            const hidden = inp.type === 'password';
            inp.type = hidden ? 'text' : 'password';
            btn.textContent = hidden ? '🙈' : '👁️';
        }

        function showError(msg) {
            document.getElementById('successBanner').classList.remove('visible');
            const el = document.getElementById('errorBanner');
            document.getElementById('errorMsg').textContent = '⚠ ' + msg;
            el.classList.add('visible');
        }

        function showSuccess(msg) {
            document.getElementById('errorBanner').classList.remove('visible');
            const el = document.getElementById('successBanner');
            document.getElementById('successMsg').textContent = '✅ ' + msg;
            el.classList.add('visible');
        }

        function clearAlerts() {
            document.getElementById('successBanner').classList.remove('visible');
            document.getElementById('errorBanner').classList.remove('visible');
        }

        function maskEmail(email) {
            const [user, domain] = email.split('@');
            return user.slice(0, 2) + '***@' + domain;
        }

        function startCountdown() {
            let seconds = 600; // 10 min
            const el = document.getElementById('countdown');
            const resendBtn = document.getElementById('resendBtn');
            resendBtn.disabled = true;

            if (countdownTimer) clearInterval(countdownTimer);
            countdownTimer = setInterval(() => {
                seconds--;
                const m = Math.floor(seconds / 60);
                const s = seconds % 60;
                el.textContent = `${m}:${s.toString().padStart(2, '0')}`;
                if (seconds <= 0) {
                    clearInterval(countdownTimer);
                    el.textContent = 'Expired';
                    resendBtn.disabled = false;
                }
            }, 1000);
        }

        // ── OTP Input Behaviour ──
        const otpInputs = document.querySelectorAll('.otp-input');
        otpInputs.forEach((inp, i) => {
            inp.addEventListener('input', (e) => {
                const val = e.target.value.replace(/[^0-9]/g, '');
                e.target.value = val;
                if (val && i < otpInputs.length - 1) otpInputs[i + 1].focus();
            });
            inp.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && !e.target.value && i > 0) {
                    otpInputs[i - 1].focus();
                }
            });
            inp.addEventListener('paste', (e) => {
                e.preventDefault();
                const paste = (e.clipboardData.getData('text') || '').replace(/[^0-9]/g, '').slice(0, 6);
                paste.split('').forEach((ch, j) => {
                    if (otpInputs[j]) otpInputs[j].value = ch;
                });
                if (paste.length > 0) otpInputs[Math.min(paste.length, 5)].focus();
            });
        });

        function getOtp() {
            return Array.from(otpInputs).map(i => i.value).join('');
        }

        // ── Step 1: Send OTP ──
        document.getElementById('emailForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            clearAlerts();

            const email = document.getElementById('email').value.trim();
            if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
                return showError('Enter a valid email address.');
            }

            const btn = document.getElementById('sendOtpBtn');
            btn.disabled = true;
            btn.innerHTML = 'Sending… <span style="display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-left:8px;"></span>';

            try {
                const res = await fetch('/api/forgot-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });
                const data = await res.json();

                if (res.ok) {
                    userEmail = email;
                    showSuccess(data.message);
                    document.getElementById('maskedEmail').textContent = maskEmail(email);

                    setTimeout(() => {
                        document.getElementById('step1').classList.remove('active');
                        document.getElementById('step2').classList.add('active');
                        clearAlerts();
                        startCountdown();
                        otpInputs[0].focus();
                    }, 1200);
                } else {
                    showError(data.detail || 'Something went wrong.');
                    btn.disabled = false;
                    btn.innerHTML = 'Send OTP →';
                }
            } catch {
                showError('Cannot connect to server.');
                btn.disabled = false;
                btn.innerHTML = 'Send OTP →';
            }
        });

        // ── Resend OTP ──
        document.getElementById('resendBtn').addEventListener('click', async () => {
            clearAlerts();
            const btn = document.getElementById('resendBtn');
            btn.disabled = true;

            try {
                const res = await fetch('/api/forgot-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: userEmail })
                });
                const data = await res.json();
                if (res.ok) {
                    showSuccess('New OTP sent!');
                    otpInputs.forEach(i => i.value = '');
                    otpInputs[0].focus();
                    startCountdown();
                } else {
                    showError(data.detail || 'Failed to resend.');
                    btn.disabled = false;
                }
            } catch {
                showError('Cannot connect to server.');
                btn.disabled = false;
            }
        });

        // ── Step 2: Reset Password ──
        document.getElementById('resetForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            clearAlerts();

            const otp = getOtp();
            const newPw = document.getElementById('newPassword').value;
            const confirmPw = document.getElementById('confirmPassword').value;

            if (otp.length !== 6) return showError('Enter the full 6-digit OTP.');
            if (newPw.length < 8) return showError('Password must be at least 8 characters.');
            if (newPw !== confirmPw) return showError('Passwords do not match.');

            const btn = document.getElementById('resetBtn');
            btn.disabled = true;
            btn.innerHTML = 'Resetting… <span style="display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-left:8px;"></span>';

            try {
                const res = await fetch('/api/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: userEmail, otp, new_password: newPw })
                });
                const data = await res.json();

                if (res.ok) {
                    if (countdownTimer) clearInterval(countdownTimer);
                    showSuccess(data.message);
                    setTimeout(() => { window.location.href = '/login'; }, 2500);
                } else {
                    showError(data.detail || 'Reset failed.');
                    btn.disabled = false;
                    btn.innerHTML = 'Reset Password →';
                }
            } catch {
                showError('Cannot connect to server.');
                btn.disabled = false;
                btn.innerHTML = 'Reset Password →';
            }
        });
    </script>
</body>

</html>
